[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nano-vllm"
version = "0.1.0"
description = "A small, test-driven vLLM-inspired inference engine for Qwen3 models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "nano-vLLM contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "torch>=2.2",
  "xxhash>=3.5",
]

[project.optional-dependencies]
model = [
  "transformers>=4.51",
  "safetensors>=0.4",
  "tokenizers>=0.20",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
nano-vllm = "nano_vllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_vllm"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "cuda: requires a CUDA device",
  "integration: exercises multiple nano_vllm components",
  "model: requires an explicitly provisioned local Qwen checkpoint",
  "benchmark: non-blocking performance test",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
